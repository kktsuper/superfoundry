      weightLabel: (this.state.weight > 0 ? '+' : '') + this.state.weight.toFixed(1),
      setWeight: (e) => this.setState({ weight: parseFloat(e.target.value) }),
      hook: this.state.hook,
      hookLabel: (this.state.hook > 0 ? '+' : '') + this.state.hook.toFixed(1),
      setHook: (e) => this.setState({ hook: parseFloat(e.target.value) }),
      bend: this.state.bend,
      bendLabel: (this.state.bend > 0 ? '+' : '') + this.state.bend.toFixed(1),
      setBend: (e) => this.setState({ bend: parseFloat(e.target.value) }),
      dimLabel: this.state.dim === '3d' ? '3D' : '2D',
      dimColor: active,
      is2d: this.state.dim !== '3d',
      toggleDim: () => this.setState((s) => ({ dim: s.dim === '3d' ? '2d' : '3d' })),
      barGap: mob ? '12px' : '26px',
      barTracking: mob ? '0.12em' : '0.18em',
      showDots: true,
      controlLabel: this.state.control === 'gyro' ? 'GYRO' : 'DRAG',
      controlColor: active,
      toggleControl: () => {
        const next = this.state.control === 'drag' ? 'gyro' : 'drag';
        if (next === 'gyro') this.requestGyro();
        this.setState({ control: next });
      },
      modes: [1, 2].map((n) => ({
        n,
        color: n === mode ? active : idle,
        pick: () => this.setMode(n)
      }))
    };
  }
}
</script>
</body>
</html>
