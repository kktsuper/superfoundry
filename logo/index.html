    const pX = dx * persp * G, pY = dy * persp * G;
    const dLen = (this.h * 1.5 + 18);
    const orthoK = 0.025 * (0.6 + this.z / 1500);
    const dX = dx * orthoK, dY = dy * orthoK;
    const ox = (pX * (1 - P.dir) + dX * P.dir) * P.off;
    const oy = (pY * (1 - P.dir) + dY * P.dir) * P.off;
    const scale = 1 + persp * (1 - P.dir) * 1.1 * P.off;
    const blur = Math.min(60, Math.max(0.5, (0.6 + 300 * persp * P.src) * P.blurM * (this.state.feather ? 11 : 1)));
    const coreBlur = this.state.feather ? blur * 0.75 : Math.min(blur * 0.18, 3);
    // theme: light = multiply (overlaps darken), dark = screen (overlaps brighten)
    const dark = this.state.dark;
    const blend = dark ? 'screen' : 'multiply';
    this.el.grain.style.mixBlendMode = dark ? 'overlay' : 'multiply';
    this.el.stage.style.background = dark
      ? 'radial-gradient(120% 120% at 50% 42%, #1C1916 0%, #141210 55%, #0C0B09 100%)'
      : 'linear-gradient(160deg, #EDE7DD 0%, #E5DFD3 55%, #D9D1C3 100%)';
    const ink = dark ? '#F2EFE9' : '#1A1A1A';
    this.el.symbol.style.fill = ink;
    this.el.word.style.fill = ink;
    this.el.sh.style.mixBlendMode = blend;
    this.el.sh2.style.mixBlendMode = blend;
    this.el.quadEls.forEach((q) => { q.style.mixBlendMode = blend; });
    const s = this.el.sh.style;
    s.transform = `translate3d(${ox}px, ${oy}px, 0) scale(${scale})`;
    s.opacity = 1;
    this.el.shPen.style.filter = `blur(${blur}px)`;
    this.el.shCore.style.filter = `blur(${coreBlur}px)`;
    // twin: a second identical ortho shadow mirrored through the symbol centre.
    this.el.quad.style.opacity = 1;
    const D = Math.PI / 180;
    const setRay = (idx, op2, ang) => {
      const st = this.el.quadEls[idx].style;
      st.opacity = op2;
      if (op2 > 0.01) {
        const c = Math.cos(ang), sn = Math.sin(ang);
        st.transform = `translate3d(${ox * c - oy * sn}px, ${ox * sn + oy * c}px, 0) scale(${scale})`;
        st.filter = `blur(${this.state.feather ? blur : coreBlur}px)`;
      }
    };
    setRay(0, P.twin, 180 * D);
    for (let i = 1; i < 5; i++) this.el.quadEls[i].style.opacity = 0;
    const s2 = this.el.sh2.style;
    s2.transform = `translate3d(${ox * -0.42}px, ${oy * -0.42}px, 0) scale(${1 + (scale - 1) * 0.5})`;
    s2.filter = `blur(${blur * 1.5}px)`;
    s2.opacity = P.sec;
    const ao = this.el.ao.style;
    ao.opacity = Math.max(0, 0.55 - persp * 3.5);
    ao.transform = `scale(${1 + persp * 0.8})`;
    const conc = Math.min(1.5, Math.max(0.6, 900 / this.z));
    const aim = 0.14;
    const glX = this.S.x + dx * aim, glY = this.S.y + innerHeight * 0.06 + dy * aim, zEff = this.z;
    // oblique projection: pool stretches to an ellipse pointing away from the light
    const obl = Math.min(1, dist / (Math.hypot(innerWidth, innerHeight) * 0.5));
    const ang = Math.atan2(dy, dx);
    const ex = 1 + obl * 0.28, ey = 1 - obl * 0.07;
    // twin: one merged pool centred on the logo, elongated to span both light positions
    const dPool = Math.hypot(glX - this.S.x, glY - this.S.y);
    const vmax = Math.max(innerWidth, innerHeight) / 100;
    const cx = glX + (this.S.x - glX) * P.twin, cy = glY + (this.S.y - glY) * P.twin;
    const ellG = (b, rPx) => {
      const sx = b * ex * (1 + P.twin * (dPool * 1.6) / (rPx * b));
      return `translate3d(${cx}px, ${cy}px, 0) rotate(${ang}rad) scale(${sx}, ${b * ey})`;
    };
    // dark mode: keep a weak illumination pool (same shape)
    const litK = dark ? 0 : 1;
    const poolK = dark ? 0.4 : 1;
    const gS = this.el.gS.style;
    gS.transform = ellG(P.gS * (0.55 + zEff / 1800), 59 * vmax);
    gS.opacity = Math.min(0.85, P.gSop * conc) * poolK;
    const gH = this.el.gH.style;
    gH.transform = ellG(0.35 + zEff / 1500, 40 * vmax);
    gH.opacity = Math.min(0.9, P.gH * conc) * poolK;
    const fl = this.el.fall.style;
    fl.transform = ellG(P.fScale * (0.5 + zEff / 1500), 120 * vmax);
    fl.opacity = P.fall * litK;
    this.raf = requestAnimationFrame(this.tick);
  };
  renderVals() {
    const mode = this.state.mode;
    const dark = this.state.dark;
    const mob = this.state.isMobile;
    // mobile: tighter bar; if even that can't fit one row, fall back to a 2x2 grid
    const grid = mob && innerWidth < 390;
    const idle = dark ? '#C4BEB4' : '#EAE5DC';
    const active = dark ? '#FFFFFF' : '#FFFFFF';
    return {
      modeName: this.NAMES[mode],
      nameColor: dark ? '#EAE5DC' : '#F4F0E8',
      dotColor: dark ? '#7A746A' : '#C9C2B6',
      darkLabel: dark ? 'DARK' : 'BRIGHT',
      darkColor: dark ? active : idle,
      featherColor: this.state.feather ? active : idle,
      toggleDark: () => this.setState((s) => ({ dark: !s.dark })),
      toggleFeather: () => this.setState((s) => ({ feather: !s.feather })),
      isMobile: this.state.isMobile,
      barGap: mob ? '12px' : '26px',
      barTracking: mob ? '0.12em' : '0.18em',
      showDots: !grid,
      barDisplay: grid ? 'grid' : 'flex',
      barCols: grid ? 'auto auto' : 'none',
      controlLabel: this.state.control === 'gyro' ? 'GYRO' : 'DRAG',
      controlColor: active,
      toggleControl: () => {
        const next = this.state.control === 'drag' ? 'gyro' : 'drag';
        if (next === 'gyro') this.requestGyro();
        this.setState({ control: next });
      },
      modes: [1, 2].map((n) => ({
        n,
        color: n === mode ? active : idle,
        pick: () => this.setMode(n)
      }))
    };
  }
}
</script>
